# Pont MQTT : le Mosquitto local de Home Assistant se connecte au broker du VPS
# et recopie les topics dans les deux sens. À placer dans /share/mosquitto/pont-vps.conf
# Remplacer les deux valeurs EN_MAJUSCULES (ne jamais commiter le vrai mot de passe).

connection vps-nilm
address NOM_DNS_DU_VPS:8883
remote_clientid ha-maison-pont
remote_username homeassistant
remote_password MOT_DE_PASSE_HOMEASSISTANT
bridge_cafile /etc/ssl/certs/ca-certificates.crt   # autorités publiques (Let's Encrypt)
bridge_insecure false                              # le certificat du VPS est vérifié
cleansession false                                 # garde la session si la connexion tombe
restart_timeout 10 60                              # reconnexion automatique (10 s puis jusqu'à 60 s)

# VPS -> maison : mesures, présence de la carte, état réel des relais, conseils de l'EMS
topic nilm/maison/etat in 1
topic nilm/maison/dispo in 1
topic nilm/maison/cmd/+/etat in 1
topic nilm/maison/conseils in 1

# maison -> VPS : ordres ON/OFF des relais (le planning cmd/plan est publié par l'EMS sur le VPS)
topic nilm/maison/cmd/+ out 1
