# Mosquitto pour tester le projet NILM en local avec Docker (même règles que le VPS)
per_listener_settings false
allow_anonymous false                 # aucun client sans compte
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl        # chaque compte n'accède qu'à ses topics

persistence true                      # garde les messages retain et les sessions QoS 1 après redémarrage
persistence_location /mosquitto/data/
log_dest stdout

# Port en clair, pour les tests sur le PC uniquement (ne jamais l'exposer sur Internet)
listener 1883

# Port chiffré TLS, comme sur le VPS
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
